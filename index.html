<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulator Dinamis Restrukturisasi Kredit</title>
    <style>
        :root {
            --bg-main: #f0fdfa;
            --panel-bg: #ffffff;
            --border-color: #cbd5e1;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --accent-blue: #0284c7;
            --success-green: #10b981;
            --fail-red: #ef4444;
            --highlight-yellow: #fef08a;
            --highlight-header: #fde047;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-dark);
            margin: 0;
            padding: 0 20px 20px 20px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- WADAH STICKY --- */
        .sticky-wrapper {
            position: sticky;
            top: 0;
            width: 100vw;
            background-color: var(--bg-main); 
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 10px;
        }

        .top-banner {
            width: 100%;
            max-width: 800px;
            text-align: center;
            margin-bottom: -15px; 
            margin-top: -10px;
        }

        .top-banner img {
            max-width: 100%;
            height: auto;
            object-fit: contain;
        }

        .divider-line {
            width: 100vw;
            height: 2px;
            background-color: var(--border-color);
            margin-bottom: 15px; 
        }

        .header-title { text-align: center; margin-bottom: 20px; max-width: 800px; margin-top: 10px;}
        .header-title h2 { margin: 0 0 8px 0; color: var(--text-dark); font-size: 22px; line-height: 1.3; }
        .header-title p { color: var(--text-muted); margin: 0; font-size: 14px; }

        /* --- Panel Kendali Awal --- */
        .control-panel {
            background: var(--panel-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            width: 100%;
            max-width: 600px;
            border-top: 5px solid var(--accent-blue);
            box-sizing: border-box;
        }

        .input-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px; }
        label { font-weight: 700; font-size: 13px; color: #334155; }
        
        select, input {
            padding: 10px 15px;
            font-size: 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            outline: none;
            transition: all 0.2s;
            font-family: inherit;
        }
        select:focus, input:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15); }

        .dpd-wrapper { display: flex; align-items: center; gap: 10px; }
        .dpd-wrapper input[type="number"] { width: 120px; }
        
        .badge-kolek {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            background: #e2e8f0;
            color: #475569;
            transition: all 0.3s;
        }
        .badge-kolek.active { background: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }
        .badge-kolek.error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }

        button.btn-mulai {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 14px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: 0.2s;
            font-size: 14px;
        }
        button.btn-mulai:disabled { background-color: #94a3b8; cursor: not-allowed; }
        button.btn-mulai:hover:not(:disabled) { background-color: #0369a1; }

        /* --- Wadah Utama Simulasi --- */
        .simulation-container {
            width: 100%;
            max-width: 1100px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0; 
            flex-grow: 1;
            padding-bottom: 40px;
        }

        .periode-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin-bottom: 20px;
        }

        .row-content {
            display: flex;
            justify-content: center;
            align-items: stretch;
            width: 100%;
        }

        .v-arrow-row {
            display: flex;
            justify-content: center;
            width: 100%;
            margin: 5px 0 15px 0;
        }

        .col-aksi, .col-hasil, .col-v-arrow {
            width: 380px;
            flex: none;
        }

        .col-aksi { display: flex; justify-content: flex-end; }
        .col-hasil { display: flex; justify-content: flex-start; }
        .col-v-arrow { display: flex; justify-content: center; }

        .col-center {
            width: 180px;
            flex: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .timeline-node {
            width: 100%;
            background: var(--panel-bg);
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            animation: slideDown 0.4s ease-out forwards;
            overflow: hidden;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .aksi-node {
            border: 1px solid #cbd5e1;
            border-top: 4px solid var(--accent-blue);
        }
        .aksi-node .node-header {
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            padding: 12px;
            text-align: center;
            font-weight: 800;
            font-size: 14px;
            color: var(--text-dark);
        }
        .aksi-node .node-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .action-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            width: 100%;
        }
        .action-controls select, .action-controls input {
            padding: 10px;
            font-size: 13px;
            flex: 1;
            box-sizing: border-box;
        }

        .hasil-node {
            border: 1px dashed #94a3b8;
            background: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .hasil-node .node-header {
            background: #e2e8f0;
            padding: 10px;
            text-align: center;
            font-weight: 700;
            font-size: 12px;
            color: #334155;
            border-bottom: 1px solid #cbd5e1;
            text-transform: uppercase;
        }
        .hasil-node .node-body {
            padding: 12px;
        }

        /* --- 3 KOLOM PARAMETER DENGAN HEADER TINGGI TETAP --- */
        .param-table {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background: #f1f5f9;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .param-card {
            display: flex;
            flex-direction: column;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            overflow: hidden;
            background: white;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
        }

        .param-card-header {
            background-color: #f1f5f9;
            color: #475569;
            font-size: 9.5px;
            font-weight: 800;
            text-transform: uppercase;
            text-align: center;
            padding: 4px 2px;
            border-bottom: 1px solid #cbd5e1;
            letter-spacing: 0.3px;
            line-height: 1.15;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .param-card-body {
            background-color: white;
            color: #0f172a;
            font-size: 14px;
            font-weight: 800;
            text-align: center;
            padding: 8px 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 36px;
            box-sizing: border-box;
            white-space: nowrap;
        }

        /* Highlight Berubah Kuning */
        .card-yellow .param-card-header {
            background-color: var(--highlight-header) !important;
            border-bottom-color: #facc15 !important;
            color: #713f12 !important;
        }
        .card-yellow .param-card-body {
            background-color: var(--highlight-yellow) !important;
            color: #854d0e !important;
        }
        .card-yellow {
            border-color: #facc15 !important;
        }
        
        .status-badge {
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 800;
            text-align: center;
            display: inline-block;
            letter-spacing: 0.2px;
        }
        .badge-success { background-color: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
        .badge-fail { background-color: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }

        .connector-arrow { color: #94a3b8; font-size: 24px; font-weight: bold; animation: slideDown 0.3s ease; }
        
        .arrow-horizontal {
            font-size: 32px;
            color: var(--accent-blue);
            font-weight: bold;
            animation: slideRight 0.4s ease-out forwards;
            line-height: 1;
        }

        @keyframes slideRight {
            from { opacity: 0; transform: translateX(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .footer-credit {
            margin-top: 40px;
            padding-bottom: 20px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 700;
            width: 100%;
        }
        .footer-sub {
            font-size: 11px;
            font-weight: normal;
            margin-top: 6px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="sticky-wrapper">
        <div class="top-banner">
            <img src="Banner Bagan Restruk MRM.png" alt="Banner Micro Risk Group">
        </div>
        <div class="divider-line"></div>
    </div>
    
    <div class="header-title">
        <h2>Kalkulator Simulasi Matriks Masa Monitoring Restrukturisasi</h2>
        <p>Alur Berurutan Transisi DPD & Kualitas (Segmen Mikro)</p>
    </div>

    <div class="control-panel">
        <div class="input-group">
            <label for="baseKolek">1. Pilih Kolektibilitas Awal:</label>
            <select id="baseKolek" onchange="handleKolekChange()">
                <option value="">-- Pilih Kolek --</option>
                <option value="1">Kol 1 (Lancar)</option>
                <option value="2">Kol 2 (SML)</option>
                <option value="3">Kol 3 (Kurang Lancar)</option>
                <option value="4">Kol 4 (Diragukan)</option>
                <option value="5">Kol 5 (Macet)</option>
            </select>
        </div>

        <div class="input-group" id="dpdInputContainer" style="display: none;">
            <label id="lblDpd">2. Masukkan DPD Sebelum Restrukturisasi (Hari):</label>
            <div class="dpd-wrapper">
                <input type="number" id="dpdInput" placeholder="0" oninput="validasiForm()" onchange="validasiForm()" onkeyup="validasiForm()">
                <span id="dpdBadge" class="badge-kolek">Status Detail</span>
            </div>
            <small id="dpdError" style="color: red; font-size: 11px; display: none;">DPD tidak sesuai dengan rentang Kolektibilitas.</small>
        </div>

        <div class="input-group">
            <label for="tglRestruk" id="lblTgl">2. Masukkan Tanggal Restrukturisasi:</label>
            <input type="date" id="tglRestruk" oninput="validasiForm()" onchange="validasiForm()">
        </div>

        <button id="btnMulai" class="btn-mulai" disabled onclick="mulaiSimulasi()">Mulai Simulasi Monitoring</button>
    </div>

    <div id="simulationArea" class="simulation-container"></div>

    <div class="footer-credit">
        <div class="footer-sub">
            Made With 💙 - © 2026 Micro Risk Group - PT. Bank Rakyat Indonesia (Persero), Tbk.
        </div>
    </div>

    <script>
        let dpdAwal = 0;
        let restrukGroup = ""; 
        let startDateStr = "";
        let stateHistory = []; 

        function getDetailKategori(dpd) {
            if (dpd === 0) return { nama: "L", kol: "1" };
            if (dpd >= 1 && dpd <= 30) return { nama: "SML 1", kol: "2" };
            if (dpd >= 31 && dpd <= 60) return { nama: "SML 2", kol: "2" };
            if (dpd >= 61 && dpd <= 90) return { nama: "SML 3", kol: "2" };
            if (dpd >= 91 && dpd <= 120) return { nama: "KL", kol: "3" };
            if (dpd >= 121 && dpd <= 150) return { nama: "D1", kol: "4" };
            if (dpd >= 151 && dpd <= 180) return { nama: "D2", kol: "4" };
            if (dpd > 180) return { nama: "M", kol: "5" };
            return { nama: "-", kol: "-" };
        }

        function formatTanggal(dateObj) {
            const months = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Ags", "Sep", "Okt", "Nov", "Des"];
            let d = dateObj.getDate().toString().padStart(2, '0');
            let m = months[dateObj.getMonth()];
            let y = dateObj.getFullYear();
            return `${d} ${m} ${y}`;
        }

        function formatBulan(dateObj) {
            const months = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Ags", "Sep", "Okt", "Nov", "Des"];
            let m = months[dateObj.getMonth()];
            let y = dateObj.getFullYear();
            return `${m} ${y}`;
        }

        function tambahHari(dateStr, days) {
            let result = new Date(dateStr);
            result.setDate(result.getDate() + days);
            return result;
        }

        function dateToYMD(dateObj) {
            let yyyy = dateObj.getFullYear();
            let mm = String(dateObj.getMonth() + 1).padStart(2, '0');
            let dd = String(dateObj.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        function handleKolekChange() {
            const baseKolVal = document.getElementById("baseKolek").value;
            const dpdContainer = document.getElementById("dpdInputContainer");
            const dpdInput = document.getElementById("dpdInput");
            const lblTgl = document.getElementById("lblTgl");
            
            document.getElementById("simulationArea").innerHTML = ""; 

            if (baseKolVal === "") {
                dpdContainer.style.display = "none";
                lblTgl.innerText = "2. Masukkan Tanggal Restrukturisasi:";
                validasiForm();
                return;
            }

            if (baseKolVal === "1") {
                dpdContainer.style.display = "none";
                dpdInput.value = 0; 
                lblTgl.innerText = "2. Masukkan Tanggal Restrukturisasi:";
            } else {
                dpdContainer.style.display = "flex";
                dpdInput.value = "";
                lblTgl.innerText = "3. Masukkan Tanggal Restrukturisasi:";
                
                let rangeText = "";
                if(baseKolVal === "2") rangeText = "(1 - 90 Hari)";
                if(baseKolVal === "3") rangeText = "(91 - 120 Hari)";
                if(baseKolVal === "4") rangeText = "(121 - 180 Hari)";
                if(baseKolVal === "5") rangeText = "(> 180 Hari)";
                
                document.getElementById("lblDpd").innerText = `2. Masukkan DPD Sebelum Restrukturisasi ${rangeText}:`;
                document.getElementById("dpdBadge").className = "badge-kolek";
                document.getElementById("dpdBadge").innerText = "Ketik Angka...";
                document.getElementById("dpdError").style.display = "none";
            }
            validasiForm();
        }

        function validasiForm() {
            const baseKolVal = document.getElementById("baseKolek").value;
            const inputVal = parseInt(document.getElementById("dpdInput").value);
            const badge = document.getElementById("dpdBadge");
            const errorTxt = document.getElementById("dpdError");
            const btnMulai = document.getElementById("btnMulai");
            const tglVal = document.getElementById("tglRestruk").value;
            
            let dpdValid = false;

            if (baseKolVal === "1") {
                dpdValid = true;
            } else {
                if (isNaN(inputVal)) {
                    badge.className = "badge-kolek"; badge.innerText = "Ketik Angka...";
                    errorTxt.style.display = "none";
                } else {
                    if (baseKolVal === "2" && inputVal >= 1 && inputVal <= 90) dpdValid = true;
                    if (baseKolVal === "3" && inputVal >= 91 && inputVal <= 120) dpdValid = true;
                    if (baseKolVal === "4" && inputVal >= 121 && inputVal <= 180) dpdValid = true;
                    if (baseKolVal === "5" && inputVal > 180) dpdValid = true;

                    const detail = getDetailKategori(inputVal);

                    if (dpdValid) {
                        badge.className = "badge-kolek active";
                        badge.innerText = `Kol ${detail.kol} (${detail.nama})`; 
                        errorTxt.style.display = "none";
                    } else {
                        badge.className = "badge-kolek error";
                        badge.innerText = "Tidak Valid";
                        errorTxt.style.display = "block";
                    }
                }
            }

            if (baseKolVal !== "" && dpdValid && tglVal !== "") {
                btnMulai.disabled = false;
            } else {
                btnMulai.disabled = true;
            }
        }

        function getBayarStateMasaMonitoring(group, periode) {
            if (group === "1") return { npl: "N", ut: "0" };
            if (group === "2") return { npl: "N", ut: "1" };
            if (group === "3") return { npl: "N", ut: "91" };
        }

        function mulaiSimulasi() {
            const baseKolVal = document.getElementById("baseKolek").value;
            dpdAwal = parseInt(document.getElementById("dpdInput").value);
            startDateStr = document.getElementById("tglRestruk").value;
            
            if (baseKolVal === "1") restrukGroup = "1";
            else if (baseKolVal === "2") restrukGroup = "2";
            else restrukGroup = "3";

            let initRestruk = getBayarStateMasaMonitoring(restrukGroup, 0);
            
            if (parseInt(initRestruk.ut) === 0 && restrukGroup !== "1") {
                initRestruk.npl = "Y";
            } else {
                initRestruk.npl = "N";
            }

            let detailRestruk = getDetailKategori(parseInt(initRestruk.ut));
            let kolRestruk = `${detailRestruk.kol} (${detailRestruk.nama})`;

            stateHistory = [];
            stateHistory[0] = { 
                kol: kolRestruk, 
                npl: initRestruk.npl, 
                ut: initRestruk.ut, 
                action: "start",
                nunggakCount: 0,
                trueUt: dpdAwal.toString()
            };

            const area = document.getElementById("simulationArea");
            area.innerHTML = "";

            let displayTglAwal = formatTanggal(new Date(startDateStr));

            const initWrapper = document.createElement("div");
            initWrapper.className = "periode-wrapper";
            
            const initRow = document.createElement("div");
            initRow.className = "row-content";
            
            initRow.innerHTML = `
                <div style="display: flex; justify-content: center; width: 100%;">
                    <div class="timeline-node hasil-node" style="border: 2px solid var(--accent-blue); max-width: 440px;">
                        <div class="node-header" style="background: #e0f2fe; color: #0369a1; border-bottom: 1px solid #bae6fd;">
                            Kondisi Awal (Tepat Setelah Restrukturisasi)<br>
                            <span style="font-size: 10px; font-weight: normal; color: #0284c7;">Per Tanggal: <b>${displayTglAwal}</b></span>
                        </div>
                        <div class="node-body">
                            <div class="param-table">
                                <div class="param-card">
                                    <div class="param-card-header">Kolek</div>
                                    <div class="param-card-body" style="font-size:${kolRestruk.length > 6 ? '12px' : '14px'};">${kolRestruk}</div>
                                </div>
                                <div class="param-card">
                                    <div class="param-card-header">NPL-Method</div>
                                    <div class="param-card-body">${initRestruk.npl}</div>
                                </div>
                                <div class="param-card">
                                    <div class="param-card-header">Umur Tunggakan</div>
                                    <div class="param-card-body">${initRestruk.ut}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            initWrapper.appendChild(initRow);
            area.appendChild(initWrapper);

            renderPeriode(1);
        }

        function triggerKalkulasi(periodeIndex) {
            let aksiVal = document.getElementById(`aksi-${periodeIndex}`).value;
            let tglInput = document.getElementById(`tglAksi-${periodeIndex}`);
            let tglVal = tglInput.value;
            
            let minDate = tglInput.min;
            let maxDate = tglInput.max;

            if (tglVal && minDate && maxDate) {
                if(tglVal < minDate) {
                    tglVal = minDate;
                    tglInput.value = minDate;
                } else if (tglVal > maxDate) {
                    tglVal = maxDate;
                    tglInput.value = maxDate;
                }
            }

            kalkulasiKeputusan(periodeIndex, aksiVal, tglVal);
        }

        function renderPeriode(periodeIndex) {
            const area = document.getElementById("simulationArea");
            
            const wrapper = document.createElement("div");
            wrapper.className = "periode-wrapper";
            wrapper.id = `wrapper-${periodeIndex}`;

            if (periodeIndex > 0) {
                const vArrowRow = document.createElement("div");
                vArrowRow.className = "v-arrow-row";
                
                let isFirstPeriod = (periodeIndex === 1);
                
                vArrowRow.innerHTML = `
                    <div class="${isFirstPeriod ? 'col-aksi' : 'col-v-arrow'}" style="${isFirstPeriod ? 'justify-content: center; width:100%;' : ''}">
                        <div class="connector-arrow">↓</div>
                    </div>
                    ${isFirstPeriod ? '' : '<div class="col-center"></div><div class="col-hasil"></div>'}
                `;
                wrapper.appendChild(vArrowRow);
            }

            let tglStartPeriode = tambahHari(startDateStr, (periodeIndex - 1) * 30);
            let tglEndPeriode = tambahHari(startDateStr, (periodeIndex * 30) - 1);
            
            let minDateStr = dateToYMD(tglStartPeriode);
            let maxDateStr = dateToYMD(tglEndPeriode);
            let rangeTanggalStr = `${formatTanggal(tglStartPeriode)} - ${formatTanggal(tglEndPeriode)}`;

            let badgeMasaHTML = periodeIndex <= 3 
                ? `<span style="background: #e0f2fe; color: #0369a1; padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: 800; margin-bottom: 5px; display: inline-block;">MASA MONITORING RESTRUK</span>` 
                : `<span style="background: #ffedd5; color: #ea580c; padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: 800; margin-bottom: 5px; display: inline-block;">SETELAH MASA MONITORING</span>`;

            let dropdownHTML = `<select id="aksi-${periodeIndex}" onchange="triggerKalkulasi(${periodeIndex})">
                <option value="">-- Pilih Aksi --</option>
                <option value="bayar">Bayar</option>
                <option value="nunggak">Nunggak</option>
            </select>`;

            let inputTglHTML = `<input type="date" id="tglAksi-${periodeIndex}" min="${minDateStr}" max="${maxDateStr}" value="${maxDateStr}" onchange="triggerKalkulasi(${periodeIndex})" title="Pilih di antara ${rangeTanggalStr}">`;

            const rowContent = document.createElement("div");
            rowContent.className = "row-content";
            rowContent.id = `row-content-${periodeIndex}`;

            rowContent.innerHTML = `
                <div class="col-aksi">
                    <div class="timeline-node aksi-node" id="aksi-node-${periodeIndex}">
                        <div class="node-header">
                            ${badgeMasaHTML}<br>
                            <span style="font-size: 15px;">PERIODE ${periodeIndex}</span><br>
                            <span style="font-size: 11px; color: #64748b; font-weight: 600; display: block; margin-top: 3px;">Rentang Waktu: ${rangeTanggalStr}</span>
                        </div>
                        <div class="node-body">
                            <label style="font-size: 11px; color: var(--text-muted); font-weight: bold; margin-bottom: -5px;">Pilih Aksi & Tgl Bayar:</label>
                            <div class="action-controls">
                                ${dropdownHTML}
                                ${inputTglHTML}
                            </div>
                        </div>
                    </div>
                </div>
            `;

            wrapper.appendChild(rowContent);
            area.appendChild(wrapper);
        }

        function hapusSetelahPeriode(index) {
            const area = document.getElementById("simulationArea");
            
            let p = index + 1;
            while (document.getElementById(`wrapper-${p}`)) {
                let wrapperToRemove = document.getElementById(`wrapper-${p}`);
                area.removeChild(wrapperToRemove);
                p++;
            }

            let rowContent = document.getElementById(`row-content-${index}`);
            if (rowContent) {
                let centerCol = rowContent.querySelector(".col-center");
                if (centerCol) rowContent.removeChild(centerCol);
                
                let hasilCol = rowContent.querySelector(".col-hasil");
                if (hasilCol) rowContent.removeChild(hasilCol);
            }
        }

        function kalkulasiKeputusan(periodeIndex, status, tglAksiValue) {
            hapusSetelahPeriode(periodeIndex);

            if (!status) return; 

            let newState = { action: status };

            let prevNunggakCount = 0;
            if (periodeIndex > 1) {
                prevNunggakCount = stateHistory[periodeIndex - 1].nunggakCount || 0;
            }

            let tglEfektifPeriodeBerikutnya = tambahHari(startDateStr, periodeIndex * 30);
            let tglBulanEfektif = tambahHari(tglEfektifPeriodeBerikutnya, 15);

            // --- LOGIKA EVALUASI PERIODE ---
            if (periodeIndex <= 3) {
                let nunggakCount = prevNunggakCount;
                if (status === 'nunggak') {
                    nunggakCount += 1;
                }
                newState.nunggakCount = nunggakCount;

                let currentTrueUt = dpdAwal + (nunggakCount * 30);
                newState.trueUt = currentTrueUt.toString();

                if (periodeIndex < 3) {
                    newState.ut = stateHistory[0].ut;
                    newState.kol = stateHistory[0].kol;
                    newState.isGagal = (nunggakCount > 0);
                } else if (periodeIndex === 3) {
                    let isGagal = (nunggakCount > 0);
                    newState.isGagal = isGagal;

                    if (isGagal) {
                        newState.ut = currentTrueUt.toString();
                    } else {
                        // REVISI BENAR: JIKA SUKSES LULUS MASA MONITORING
                        if (restrukGroup === "1") {
                            newState.ut = "0"; // Jika awal dari Lancar (Kol 1), tetap jadi 0
                        } else {
                            newState.ut = "1"; // Jika awal restruk NPL (Kol 2, 3, dst), maka jadi 1 (SML 1)
                        }
                    }

                    let detail = getDetailKategori(parseInt(newState.ut));
                    newState.kol = `${detail.kol} (${detail.nama})`;
                }

            // --- LOGIKA PASCA MONITORING (PERIODE 4 KE ATAS) ---
            } else {
                newState.isGagal = stateHistory[3].isGagal;

                let prevUt = parseInt(stateHistory[periodeIndex - 1].ut);
                let newUt = prevUt;

                if (status === 'nunggak') {
                    newUt = prevUt + 30;
                } else if (status === 'bayar') {
                    newUt = Math.max(0, prevUt - 30);
                }

                newState.ut = newUt.toString();
                let detail = getDetailKategori(newUt);
                newState.kol = `${detail.kol} (${detail.nama})`;
            }

            // --- LOGIKA PENENTUAN NPL-METHOD YANG BENAR ---
            // 1. Ambil status NPL dari periode sebelumnya
            let prevNpl = (periodeIndex > 1) ? stateHistory[periodeIndex - 1].npl : stateHistory[0].npl;

            // 2. Jika sebelumnya sudah "Y", maka kunci terus menjadi "Y"
            if (prevNpl === "Y") {
                newState.npl = "Y";
            } else {
                // 3. Jika masih "N", jalankan logika penentuan normal
                if (restrukGroup === "1") {
                    if (periodeIndex >= 3) {
                        newState.npl = "Y";
                    } else {
                        newState.npl = "N";
                    }
                } else {
                    if (parseInt(newState.ut) === 0) {
                        newState.npl = "Y";
                    } else {
                        newState.npl = "N";
                    }
                }
            }

            stateHistory[periodeIndex] = newState;

            let prevState = (periodeIndex > 1) ? stateHistory[periodeIndex - 1] : stateHistory[0];
            let isKolYellow = (newState.kol !== prevState.kol);
            let isNplYellow = (newState.npl !== prevState.npl);
            let isUtYellow = (newState.ut !== prevState.ut);

            let badgeClass = (status === 'bayar') ? 'badge-success' : 'badge-fail';
            let labelText = (status === 'bayar') ? 'BAYAR' : 'GAGAL BAYAR';

            let tglAksiObj = new Date(tglAksiValue);
            const rowContent = document.getElementById(`row-content-${periodeIndex}`);

            const centerCol = document.createElement("div");
            centerCol.className = "col-center";
            
            centerCol.innerHTML = `
                <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; margin-bottom: 5px; z-index: 5;">
                    <span style="font-size: 10px; color: var(--text-muted); text-align: center; line-height: 1.2;">Status Eksekusi Tgl:<br><b>${formatTanggal(tglAksiObj)}</b></span>
                    <span class="status-badge ${badgeClass}" style="padding: 4px 8px; white-space: nowrap;">${labelText}</span>
                </div>
                <div class="arrow-horizontal" style="margin-top: -5px;">➔</div>
            `;
            rowContent.appendChild(centerCol);

            const rightCol = document.createElement("div");
            rightCol.className = "col-hasil";
            rightCol.innerHTML = `
                <div class="timeline-node hasil-node" id="hasil-node-${periodeIndex}">
                    <div class="node-header">
                        HASIL KUALITAS KREDIT<br>
                        <span style="font-size: 10px; font-weight: normal; text-transform: none;">Posisi Memasuki Periode ${periodeIndex + 1} (Efektif per ${formatBulan(tglBulanEfektif)})</span>
                    </div>
                    <div class="node-body">
                        <div class="param-table">
                            <div class="param-card ${isKolYellow ? 'card-yellow' : ''}">
                                <div class="param-card-header">Kolek</div>
                                <div class="param-card-body" style="font-size:${newState.kol.length > 6 ? '12px' : '14px'};">${newState.kol}</div>
                            </div>
                            <div class="param-card ${isNplYellow ? 'card-yellow' : ''}">
                                <div class="param-card-header">NPL-Method</div>
                                <div class="param-card-body">${newState.npl}</div>
                            </div>
                            <div class="param-card ${isUtYellow ? 'card-yellow' : ''}">
                                <div class="param-card-header">Umur Tunggakan</div>
                                <div class="param-card-body">${newState.ut}</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            rowContent.appendChild(rightCol);

            renderPeriode(periodeIndex + 1);
        }
    </script>
</body>
</html>
